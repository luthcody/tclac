
substitutions:
# Unique name for this device. Latin letters and digits only (no spaces or
# punctuation), e.g. "tclac". If you flash more than one AC module, give each
# one a distinct name — tclac1, tclac2, tclac3 — so Home Assistant can tell
# them apart.
  device_name: tclac
# Human-readable name shown in Home Assistant.
  humanly_name: TCL Air Conditioner
# WiFi credentials. Prefer storing these in ESPHome's secrets.yaml; otherwise
# replace the !secret references with literal strings.
# WiFi SSID:
  wifi_ssid: !secret wifi_ssid
# WiFi password:
  wifi_password: !secret wifi_password
# Password for the device's fallback access point. The AP name will be
# "{device_name} Fallback Hotspot".
  recovery_pass: mKSzmBdt7DAj
# OTA update password. Generated once, then reused for every subsequent update.
  ota_pass: 90cf525a594c8bb2cbf917bc2c2fa058
# Home Assistant API key. Generate a fresh key here:
# https://esphome.io/components/api.html
  api_key: lmUoWsWs1oqSfJqLFsA6PisHSx4Y1G+iu7V3PDIqpXk=
# UART pins on the ESP module.
  uart_rx: GPIO3
  uart_tx: GPIO1
# Activity LED pins (only used when packages/leds.yaml is enabled below).
# If you aren't using the LEDs these values are ignored.
  receive_led: GPIO6
  transmit_led: GPIO4
# Set to "true" to put the indoor-unit panel into °F display mode. The wire
# protocol stays in °C with 0.5°C granularity either way; this just changes
# what the plastic bezel shows.
# fahrenheit_display: "true"

# Add-on packages. Each one is a separate yaml file pulled from GitHub at
# build time. The core package is required; the rest are opt-in.
# - packages/leds.yaml         — RX/TX LEDs on receive_led / transmit_led
# - packages/bad_connect.yaml  — repeats each command 3× on noisy links
# - packages/uart_speed.yaml   — exposes a UART baud-rate selector in the UI
#
# Indentation matters: every file line below must line up at the marked
# column, otherwise ESPHome parses it wrong.
packages:
  remote_package:
    url: https://github.com/luthcody/tclac.git
    ref: master
    files:
    # v - keep every file line indented to this column
      - packages/core.yaml        # required — the climate component
      # - packages/leds.yaml
      # - packages/bad_connect.yaml
      # - packages/uart_speed.yaml
    refresh: 0s

# Pick the platform block that matches the module you're flashing. Only one
# block should be uncommented at a time.

# ESP-01S
esp8266:
  board: esp01_1m

# Hommyn HDN/WFN-02-01 (ESP32-C3)
